<!doctype html>
<html lang="en">
  <body style="font-family:Arial,sans-serif;background:#f4f6f8;padding:32px;color:#122333">
    <div style="max-width:480px;margin:auto;background:white;border:1px solid #dfe6eb;border-radius:10px;padding:28px">
      <div style="font-size:24px;letter-spacing:.08em;color:#063d68">UNICITY.</div>
      <p style="font-size:12px;letter-spacing:.16em;color:#6e7e8c">TOP UP · EMPLOYEE ACCESS</p>
      <h1 style="font-size:22px">Your secure sign-in code</h1>
      <p>Enter this one-time code in Top Up:</p>
      <div style="font-size:32px;font-weight:700;letter-spacing:.3em;background:#edf5fa;border-radius:7px;padding:18px;text-align:center">{{ .Token }}</div>
      <p style="font-size:13px;color:#6e7e8c">This code expires shortly and can only be used once.</p>
      <p><a href="{{ .SiteURL }}" style="color:#0a65a6">Return to Top Up</a></p>
    </div>
  </body>
</html>
